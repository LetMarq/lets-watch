<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistir · LetsWatch</title>
  <meta name="description" content="Assista a esta live no LetsWatch, direto no navegador.">
  <meta property="og:title" content="Live no LetsWatch">
  <meta property="og:description" content="Aperte o play: clique para assistir, direto no navegador.">
  <meta property="og:site_name" content="LetsWatch">
  <meta name="theme-color" content="#15110e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:ital,wght@1,900&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="pagina-ver">
  <div class="palco crt" id="palco">
    <video id="video" autoplay muted playsinline></video>
    <div class="efeito-crt"></div>
    <div class="camada-reacoes" id="reacoes" aria-hidden="true"></div>

    <!-- Telas de espera: estática (sem sinal) ou tela azul de videocassete -->
    <div class="aviso-palco" id="aviso">
      <canvas class="estatica" id="estatica" aria-hidden="true"></canvas>
      <div class="estatica-barra" id="estatica-barra"></div>
      <div class="camada" id="aviso-camada">
        <span class="osd osd-grande" id="aviso-titulo">Sintonizando...</span>
        <span class="osd osd-medio" id="aviso-texto"></span>
        <a class="botao botao-pequeno escondido" id="aviso-link" href="/turn" target="_blank">Configurar meu TURN</a>
      </div>
      <div class="vidro"></div>
    </div>

    <header class="barra-topo">
      <span class="osd osd-play escondido" id="osd-play">▶ Play</span>
      <span class="osd titulo" id="titulo">LetsWatch</span>
      <span class="espaco"></span>
      <span class="osd osd-direita">
        <span class="rec piscar escondido" id="selo-ao-vivo">● Ao vivo</span>
        <span id="espectadores"></span>
      </span>
    </header>

    <button class="botao botao-principal ativar-som escondido" id="ativar-som" type="button">🔊 Ativar som</button>

    <div class="bandeja-reacoes escondido" id="bandeja-reacoes" role="group" aria-label="Enviar reação"></div>

    <footer class="barra-baixo">
      <button class="icone-botao" id="botao-som" type="button" title="Som (M)" aria-label="Ativar ou desativar som">
        <svg id="icone-mudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        <svg id="icone-som" class="escondido" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button class="icone-botao escondido" id="botao-reacoes" type="button" title="Reações" aria-label="Enviar reação" aria-expanded="false">😀</button>
      <a class="marca marca-pequena" href="/" target="_blank">LetsWatch <span class="listras" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></a>
      <span class="espaco"></span>
      <button class="icone-botao ativo" id="botao-crt" type="button" title="Efeito de TV de tubo" aria-label="Efeito de TV de tubo" aria-pressed="true">CRT</button>
      <button class="icone-botao" id="botao-preencher" type="button" title="Preencher a tela" aria-label="Preencher a tela">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="18" height="14"/><path d="M7 9h3M7 9v3M17 15h-3M17 15v-3"/></svg>
      </button>
      <button class="icone-botao" id="botao-pip" type="button" title="Picture-in-picture" aria-label="Picture-in-picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="2" y="4" width="20" height="16"/><rect x="12" y="12" width="7" height="5" fill="currentColor"/></svg>
      </button>
      <button class="icone-botao" id="botao-tela-cheia" type="button" title="Tela cheia (F)" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M8 3H3v5M21 8V3h-5M3 16v5h5M16 21h5v-5"/></svg>
      </button>
    </footer>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
