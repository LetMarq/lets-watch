<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistir · LetsWatch</title>
  <meta name="description" content="Assista a esta live no LetsWatch, direto no navegador.">
  <meta property="og:title" content="Live no LetsWatch">
  <meta property="og:description" content="Aperte o play: clique para assistir, direto no navegador.">
  <meta property="og:site_name" content="LetsWatch">
  <meta name="theme-color" content="#15110e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:ital,wght@1,900&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="watch-page">
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline></video>
    <div class="crt-effect"></div>
    <div class="reactions-layer" id="reactions" aria-hidden="true"></div>

    <!-- Waiting screens: static (no signal) or VCR blue screen -->
    <div class="stage-notice" id="notice">
      <canvas class="static" id="static" aria-hidden="true"></canvas>
      <div class="static-bar" id="static-bar"></div>
      <div class="layer" id="notice-layer">
        <span class="osd osd-large" id="notice-title">Sintonizando...</span>
        <span class="osd osd-medium" id="notice-text"></span>
        <a class="btn btn-small hidden" id="notice-link" href="/turn" target="_blank">Configurar meu TURN</a>
      </div>
      <div class="glass"></div>
    </div>

    <header class="stage-top">
      <span class="osd osd-play hidden" id="osd-play">▶ Play</span>
      <span class="osd title" id="title">LetsWatch</span>
      <span class="spacer"></span>
      <span class="osd osd-right">
        <span class="rec blink hidden" id="live-badge">● Ao vivo</span>
        <span id="viewers"></span>
      </span>
    </header>

    <button class="btn btn-primary unmute-btn hidden" id="unmute" type="button">🔊 Ativar som</button>

    <div class="reactions-tray hidden" id="reactions-tray" role="group" aria-label="Enviar reação"></div>

    <footer class="stage-bottom">
      <div class="volume">
        <button class="icon-btn" id="sound-btn" type="button" title="Som (M)" aria-label="Ativar ou desativar som">
          <svg id="icon-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
          <svg id="icon-sound" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <input class="volume-slider" id="volume" type="range" min="0" max="100" step="1" value="0" title="Volume (↑ ↓)" aria-label="Volume">
        <span class="osd volume-level" id="volume-level" aria-hidden="true">00</span>
      </div>
      <button class="icon-btn hidden" id="reactions-btn" type="button" title="Reações" aria-label="Enviar reação" aria-expanded="false">😀</button>
      <a class="brand brand-small" href="/" target="_blank">LetsWatch <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></a>
      <span class="spacer"></span>
      <button class="icon-btn" id="crt-btn" type="button" title="Efeito de TV de tubo" aria-label="Efeito de TV de tubo" aria-pressed="false">CRT</button>
      <button class="icon-btn" id="fill-btn" type="button" title="Preencher a tela" aria-label="Preencher a tela">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="18" height="14"/><path d="M7 9h3M7 9v3M17 15h-3M17 15v-3"/></svg>
      </button>
      <button class="icon-btn" id="pip-btn" type="button" title="Picture-in-picture" aria-label="Picture-in-picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="2" y="4" width="20" height="16"/><rect x="12" y="12" width="7" height="5" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="fullscreen-btn" type="button" title="Tela cheia (F)" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M8 3H3v5M21 8V3h-5M3 16v5h5M16 21h5v-5"/></svg>
      </button>
    </footer>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
